---
############
# Security #
############

##################
# authorized_key #
##################
- name: Ensure 'no-agent-forwarding' doesn't exist in root's authorized_key file
  lineinfile:
    path: /root/.ssh/authorized_key
    state: absent
    regexp: '^no-agent-forwarding'
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

- name: Ensure keybox's ssh key is applied to root's authorized_key file
  authorized_key:
    user: root
    state: present
    key: "{{ Keybox_SSHKey }}"
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

###############
# sshd_config #
###############
- name: Security - Disable Password Authentication for all users
  lineinfile: dest=/etc/ssh/sshd_config
              regexp="^PasswordAuthentication"
              line="PasswordAuthentication no"
              state=present
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

- name: Security - Disable Password Authentication for root user
  lineinfile: dest=/etc/ssh/sshd_config
              regexp="^PermitRootLogin"
              line="PermitRootLogin without-password"
              state=present
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

- name: Security - Disable ChallengeResponseAuthentication for all users
  lineinfile: dest=/etc/ssh/sshd_config
              regexp="^ChallengeResponseAuthentication"
              line="ChallengeResponseAuthentication no"
              state=present
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

# sshd uses the first value it finds and reads sshd_config.d/ before the rest of sshd_config, so files
# such as 50-cloud-init.conf (PasswordAuthentication yes) override the lineinfile edits above.
# A 00- drop-in sorts first and wins.
- name: Security - Check for sshd_config.d
  stat:
    path: /etc/ssh/sshd_config.d
  register: sshd_config_d
  when:
    - Security == "Enabled"
    - ansible_system == "Linux"
  tags: [security, adoptopenjdk]

# Older OpenSSH (e.g. CentOS 6/7) has no Include support, so a drop-in would be silently ignored.
- name: Security - Check sshd_config includes sshd_config.d
  command: grep -Eqi '^[[:space:]]*Include[[:space:]].*sshd_config\.d' /etc/ssh/sshd_config
  register: sshd_config_include
  changed_when: false
  failed_when: false
  when:
    - Security == "Enabled"
    - ansible_system == "Linux"
    - sshd_config_d.stat.isdir is defined
    - sshd_config_d.stat.isdir
  tags: [security, adoptopenjdk]

- name: Security - Disable password authentication in an sshd_config.d drop-in
  copy:
    dest: /etc/ssh/sshd_config.d/00-disable-password.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: '0600'
  when:
    - Security == "Enabled"
    - ansible_system == "Linux"
    - sshd_config_include.rc is defined
    - sshd_config_include.rc == 0
  tags: [security, adoptopenjdk]

# Runs before the restarts below, so a bad config stops the play while the running sshd is untouched.
- name: Security - Validate sshd configuration
  command: sshd -t
  changed_when: false
  when:
    - Security == "Enabled"
    - ansible_system == "Linux"
    - sshd_config_include.rc is defined
    - sshd_config_include.rc == 0
  tags: [security, adoptopenjdk]

- name: Restart ssh service
  service:
    name: ssh
    state: restarted
    enabled: yes
  failed_when: false
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

- name: Restart sshd service
  service:
    name: sshd
    state: restarted
    enabled: yes
  failed_when: false
  when:
    - Security == "Enabled"
  tags: [security, adoptopenjdk]

##################
# Account Policy #
##################
- name: Account policy - expire date
  command: chage -E -1 "{{ item }}"
  failed_when: false
  with_items:
    - root
    - "{{ Jenkins_Username }}"
    - nagios
    - zeus
  when:
    - Security == "Enabled"
    - ansible_distribution != "FreeBSD"
  tags: [security, adoptopenjdk]

- name: Account policy - max days
  command: chage -M -1 "{{ item }}"
  failed_when: false
  with_items:
    - root
    - "{{ Jenkins_Username }}"
    - nagios
    - zeus
  when:
    - Security == "Enabled"
    - ansible_distribution != "FreeBSD"
  tags: [security, adoptopenjdk]
