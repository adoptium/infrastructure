---
# Secret detection workflow — scans changed commits on every PR for accidentally
# committed credentials, tokens, or API keys.
#
# Uses the gitleaks binary directly (not gitleaks-action) to avoid the
# commercial licence requirement that applies to organisation-owned repos.
# The gitleaks binary is verified against the official SHA256 checksum before use.
#
# Known safe patterns (documentation examples with placeholder values) are
# allow-listed via .gitleaksignore at the repo root.
#
# Findings are uploaded to the GitHub Security tab as SARIF and block the PR.

name: Secret Scan

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history required for commit-range diff scanning

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Run Gitleaks
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          /tmp/gitleaks detect \
            --log-opts="${MERGE_BASE}..${HEAD_SHA}" \
            --report-format sarif \
            --report-path results.sarif \
            --exit-code 2 \
            --redact \
            -v

      - name: Upload SARIF to Security tab
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
